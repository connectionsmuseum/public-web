name: check
on:
  pull_request:
    branches:
      - trunk
  merge_group:
    types: [checks_requested]
permissions: {}
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: |
          npm ci
          npm exec -- prettier . --check
