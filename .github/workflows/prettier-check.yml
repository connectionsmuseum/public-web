name: prettier check
on:
  pull_request:
    branches:
      - trunk
    paths:
      - "**.html"
      - "**.css"
      - "**.js"
      - "**.md"
      - "**.tsx"
      - "**.json"
  merge_group:
    types: [checks_requested]
  # page_build:
permissions: {}
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: |
          npm ci
          npm exec -- prettier . --check
